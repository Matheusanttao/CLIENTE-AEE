    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A&amp;E Total Mix" />
    <meta property="og:locale" content="pt_BR" />

    <meta property="og:description" content="A&amp;E Total Mix: tênis, perfumes e muito mais no varejo e no atacado. Compre online com pagamento seguro e envio para todo o Brasil." />
    <meta property="og:url" content="https://passarinsuplementos.com.br/" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://passarinsuplementos.com.br/aee-og.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Store", "Organization"],
        "name": "A&E Total Mix",
        "url": "https://passarinsuplementos.com.br/",
        "logo": "https://passarinsuplementos.com.br/aee-logo.webp",
        "description": "Tênis, perfumes e muito mais no varejo e no atacado."
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Splash imediato: cobre qualquer flash de layout/CSS default antes do React. -->
    <style>
      html {
        background: #ffffff;
      }

      html:not(.app-ready) {
        overflow: hidden;
      }

      html:not(.app-ready) #root {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      html.app-ready #root {
        visibility: visible;
        opacity: 1;
      }

      #app-preloader {
        --splash-brand: #0066ff;
        --splash-ink: #101828;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        margin: 0;
        background: #ffffff;
        color: var(--splash-ink);
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        transition: opacity 320ms ease, visibility 320ms ease;
      }

      #app-preloader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #app-preloader .splash {
        display: grid;
        justify-items: center;
        gap: 1.25rem;
        padding: 1.5rem;
        text-align: center;
        max-width: min(90vw, 28rem);
      }

      #app-preloader .mark {
        display: grid;
        place-items: center;
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 0.9rem;
        background: var(--splash-brand);
        color: #ffffff;
        box-shadow: none;
      }

      #app-preloader .mark svg {
        width: 1.65rem;
        height: 1.65rem;
        fill: currentColor;
      }

      #app-preloader .logo {
        display: block;
        max-height: 5rem;
        max-width: min(80vw, 16rem);
        width: auto;
        height: auto;
        object-fit: contain;
      }

      #app-preloader .brand {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
        word-break: break-word;
      }

      #app-preloader .tag {
        margin: 0.35rem 0 0;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #667085;
      }

      #app-preloader .spinner {
        width: 1.75rem;
        height: 1.75rem;
        border: 2.5px solid #e4e7ec;
        border-top-color: var(--splash-brand);
        border-radius: 50%;
        animation: app-spin 0.7s linear infinite;
      }

      #app-preloader .hint {
        margin: 0;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        font-size: 0.8125rem;
        font-weight: 500;
        color: #667085;
      }

      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-preloader" role="status" aria-live="polite" aria-busy="true">
      <div class="splash">
        <img class="logo" data-splash-logo alt="" hidden />
        <span class="mark" data-splash-mark aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L4.5 13.5h6L11 22l8.5-11.5h-6L13 2z" />
          </svg>
        </span>
        <div data-splash-text>
          <p class="brand" data-splash-brand>A&amp;E Total Mix</p>
          <p class="tag" data-splash-tag hidden></p>
        </div>
        <div class="spinner" aria-hidden="true"></div>
        <p class="hint">Carregando...</p>
      </div>
    </div>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('m-ecommerce:site-settings:v1')
          if (!raw) return
          var s = JSON.parse(raw)
          // Cache da identidade anterior: ignora e mantem o splash padrao da A&E Total Mix.
          if (s && /passari|suplement/i.test(s.store_name || '')) return
          var root = document.getElementById('app-preloader')
          if (!root || !s) return

          var brand = (s.color_brand || '#0066FF').trim()
          var ink = (s.color_ink || '#101828').trim()
          root.style.setProperty('--splash-brand', brand)
          root.style.setProperty('--splash-ink', ink)

          var name = (s.store_name_short || s.store_name || '').trim()
          var tagline = (s.store_tagline || '').trim()
          var logoUrl = (s.logo_url || '').trim()
          var logoEnabled = s.logo_enabled !== false && !!logoUrl
          var showText = s.logo_show_text !== false || !logoEnabled

          var logoImg = root.querySelector('[data-splash-logo]')
          var mark = root.querySelector('[data-splash-mark]')
          var brandEl = root.querySelector('[data-splash-brand]')
          var tagEl = root.querySelector('[data-splash-tag]')
          var textBlock = root.querySelector('[data-splash-text]')

          if (logoEnabled && logoImg && mark) {
            logoImg.src = logoUrl
            logoImg.alt = (s.store_name || name || '').trim()
            logoImg.hidden = false
            mark.hidden = true
          }

          if (brandEl && name) brandEl.textContent = name
          if (tagEl) {
            tagEl.textContent = tagline
            tagEl.hidden = !tagline
          }
          if (textBlock) textBlock.hidden = !showText
          if (s.store_name) document.title = s.store_name
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
